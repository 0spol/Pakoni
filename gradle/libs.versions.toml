[versions]
# ══════════════════════════════════════════════════════════════
# 🔧 Build Tools & Kotlin
# ══════════════════════════════════════════════════════════════
agp = "8.13.0"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.3"

# ══════════════════════════════════════════════════════════════
# ⚙️ SDK
# ══════════════════════════════════════════════════════════════
# @keep
compileSdk = "36"
targetSdk = "35"
minSdk = "24"

# ══════════════════════════════════════════════════════════════
# 📦 AndroidX Core
# ══════════════════════════════════════════════════════════════
appcompat = "1.7.1"
coreKtx = "1.17.0"
constraintlayout = "2.2.1"
lifecycleRuntimeKtx = "2.9.4"

# ══════════════════════════════════════════════════════════════
# 🎨 Jetpack Compose
# ══════════════════════════════════════════════════════════════
activityCompose = "1.11.0"
compiler = "1.5.15"
composeBom = "2025.09.01"
navigationCompose = "2.9.5"
runtimeLivedata = "1.9.2"
runtimeAndroid = "1.9.2"
uiGraphicsAndroid = "1.9.2"
foundationAndroid = "1.9.2"
material3Android = "1.4.0"

# ══════════════════════════════════════════════════════════════
# 🎨 Material Design
# ══════════════════════════════════════════════════════════════
material = "1.13.0"

# ══════════════════════════════════════════════════════════════
# 💉 Dependency Injection (Hilt)
# ══════════════════════════════════════════════════════════════
hilt = "2.57.2"
androidxHilt = "1.3.0"

# ══════════════════════════════════════════════════════════════
# 🗄️ Room Database
# ══════════════════════════════════════════════════════════════
room = "2.8.1"

# ══════════════════════════════════════════════════════════════
# 🌐 Networking (Retrofit)
# ══════════════════════════════════════════════════════════════
retrofit = "3.0.0"

# ══════════════════════════════════════════════════════════════
# 📄 Paging & Image Loading
# ══════════════════════════════════════════════════════════════
pagingCompose = "3.3.6"
pagingCommonAndroid = "3.3.6"
pagingComposeAndroid = "3.3.6"
coilCompose = "2.7.0"

# ══════════════════════════════════════════════════════════════
# 🔄 Serialization
# ══════════════════════════════════════════════════════════════
kotlinxSerialization = "1.9.0"

# ══════════════════════════════════════════════════════════════
# 🧪 Testing
# ══════════════════════════════════════════════════════════════
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# ══════════════════════════════════════════════════════════════
# 📚 LIBRARIES
# ══════════════════════════════════════════════════════════════

[libraries]
# ──────────────────────────────────────────────────────────────
# AndroidX Core & Lifecycle
# ──────────────────────────────────────────────────────────────
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }

# ──────────────────────────────────────────────────────────────
# Jetpack Compose - Core
# ──────────────────────────────────────────────────────────────
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compiler = { module = "androidx.compose.compiler:compiler", version.ref = "compiler" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "runtimeLivedata" }
androidx-runtime-android = { group = "androidx.compose.runtime", name = "runtime-android", version.ref = "runtimeAndroid" }

# ──────────────────────────────────────────────────────────────
# Jetpack Compose - UI
# ──────────────────────────────────────────────────────────────
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-graphics-android = { group = "androidx.compose.ui", name = "ui-graphics-android", version.ref = "uiGraphicsAndroid" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-util = { group = "androidx.compose.ui", name = "ui-util" }

# ──────────────────────────────────────────────────────────────
# Jetpack Compose - Foundation & Layout
# ──────────────────────────────────────────────────────────────
androidx-foundation-android = { group = "androidx.compose.foundation", name = "foundation-android", version.ref = "foundationAndroid" }
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }

# ──────────────────────────────────────────────────────────────
# Jetpack Compose - Material Design
# ──────────────────────────────────────────────────────────────
androidx-material = { group = "androidx.compose.material", name = "material" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material3-android = { group = "androidx.compose.material3", name = "material3-android", version.ref = "material3Android" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# ──────────────────────────────────────────────────────────────
# Jetpack Compose - Navigation
# ──────────────────────────────────────────────────────────────
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ──────────────────────────────────────────────────────────────
# Dependency Injection - Hilt
# ──────────────────────────────────────────────────────────────
hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }

# ──────────────────────────────────────────────────────────────
# Room Database
# ──────────────────────────────────────────────────────────────
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ──────────────────────────────────────────────────────────────
# Networking - Retrofit
# ──────────────────────────────────────────────────────────────
retrofit2-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }

# ──────────────────────────────────────────────────────────────
# Paging
# ──────────────────────────────────────────────────────────────
androidx-paging = { group = "androidx.paging", name = "paging-compose", version.ref = "pagingCompose" }
androidx-paging-common-android = { group = "androidx.paging", name = "paging-common-android", version.ref = "pagingCommonAndroid" }
androidx-paging-compose-android = { group = "androidx.paging", name = "paging-compose-android", version.ref = "pagingComposeAndroid" }

# ──────────────────────────────────────────────────────────────
# Image Loading - Coil
# ──────────────────────────────────────────────────────────────
io-coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }

# ──────────────────────────────────────────────────────────────
# Serialization
# ──────────────────────────────────────────────────────────────
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# ──────────────────────────────────────────────────────────────
# Testing
# ──────────────────────────────────────────────────────────────
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# ══════════════════════════════════════════════════════════════
# 🔌 PLUGINS
# ══════════════════════════════════════════════════════════════

[plugins]
# Android & Kotlin
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
org-jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

# Kotlin Compiler & Processing
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Dependency Injection
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }